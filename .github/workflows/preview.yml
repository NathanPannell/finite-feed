name: Full-stack PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_ENVIRONMENT: pr-${{ github.event.pull_request.number }}
  PREVIEW_PULL_REQUEST: ${{ github.event.pull_request.number }}
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
  RAILWAY_BASE_ENVIRONMENT_ID: ${{ vars.RAILWAY_BASE_ENVIRONMENT_ID }}
  RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
  RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_OIDC_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
  VERCEL_OIDC_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}

jobs:
  deploy:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == vars.TRUSTED_PREVIEW_ACTOR && github.actor == vars.TRUSTED_PREVIEW_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Require the current open PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/assert-preview-state.mjs deploy

      - name: Set Neon safety expiration
        id: expiry
        run: echo "expires_at=$(date -u -d '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse Neon branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          parent_branch: ${{ vars.NEON_PARENT_BRANCH }}
          database: app
          role: app_owner
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.expiry.outputs.expires_at }}

      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 neon@4.13.1 vercel@50.1.3

      - name: Require admin OIDC configuration
        run: |
          : "${VERCEL_OIDC_TEAM_SLUG:?VERCEL_TEAM_SLUG repository variable is required}"
          : "${VERCEL_OIDC_PROJECT_NAME:?VERCEL_PROJECT_NAME repository variable is required}"

      - name: Resolve isolated Neon Auth endpoint
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          auth_url="$(neon neon-auth status --project-id "${{ vars.NEON_PROJECT_ID }}" --branch "$NEON_BRANCH" --output json --no-color | jq -er '.base_url | select(startswith("https://"))')"
          parent_auth_url="$(neon neon-auth status --project-id "${{ vars.NEON_PROJECT_ID }}" --branch "${{ vars.NEON_PARENT_BRANCH }}" --output json --no-color | jq -er '.base_url | select(startswith("https://"))')"
          google_callback="$(NEON_AUTH_BASE_URL="$auth_url" PARENT_NEON_AUTH_BASE_URL="$parent_auth_url" node scripts/validate-preview-auth-config.mjs)"
          printf 'NEON_AUTH_BASE_URL=%s\nPARENT_NEON_AUTH_BASE_URL=%s\nGOOGLE_OAUTH_CALLBACK=%s\n' \
            "$auth_url" "$parent_auth_url" "$google_callback" >> "$GITHUB_ENV"

      - name: Create or update isolated Railway environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          PREVIEW_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_DEVELOPER_BOT_TOKEN: ${{ secrets.TELEGRAM_DEVELOPER_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MATCH_LAB_COOKIE_SECRET: ${{ secrets.MATCH_LAB_COOKIE_SECRET }}
          MATCH_LAB_DEBUG_ASSESSMENT: ${{ vars.MATCH_LAB_PREVIEW_DEBUG_ASSESSMENT }}
          DEVELOPER_TELEGRAM_USER_IDS: ${{ vars.DEVELOPER_TELEGRAM_USER_IDS }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_MODEL_REVISION: ${{ vars.EMBEDDING_MODEL_REVISION }}
          EMBEDDING_BATCH_SIZE: ${{ vars.EMBEDDING_BATCH_SIZE }}
          MODEL_DAILY_REQUEST_LIMIT: ${{ vars.MODEL_DAILY_REQUEST_LIMIT }}
          YOUTUBE_DAILY_REQUEST_LIMIT: ${{ vars.YOUTUBE_DAILY_REQUEST_LIMIT }}
        run: |
          : "${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}"
          : "${TELEGRAM_DEVELOPER_BOT_TOKEN:?TELEGRAM_DEVELOPER_BOT_TOKEN is required}"
          if [[ -z "$MATCH_LAB_COOKIE_SECRET" ]]; then
            MATCH_LAB_COOKIE_SECRET="$(openssl rand -hex 32)"
            echo "Using an ephemeral Match Lab signing secret for this preview deployment."
          fi
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_BASE_ENVIRONMENT_ID"
          if railway environment list --json | jq -e --arg name "$PREVIEW_ENVIRONMENT" '.. | objects | select(.name? == $name)' >/dev/null; then
            echo "Railway environment already exists; updating it in place."
          else
            railway environment new "$PREVIEW_ENVIRONMENT" \
              --copy "$RAILWAY_BASE_ENVIRONMENT_ID" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.DATABASE_URL.value "$PREVIEW_DATABASE_URL" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.DATABASE_URL_UNPOOLED.value "$PREVIEW_DATABASE_URL_UNPOOLED" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.PREVIEW_DATABASE_URL.value "$PREVIEW_DATABASE_URL" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.PREVIEW_DATABASE_URL_UNPOOLED.value "$PREVIEW_DATABASE_URL_UNPOOLED" \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.DELIVERY_ENABLED.value false \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.TELEGRAM_PRODUCTION_BOT_TOKEN.value disabled-in-preview \
              --service-config "$RAILWAY_API_SERVICE_ID" variables.TELEGRAM_PRODUCTION_CHAT_ID.value disabled-in-preview \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.DATABASE_URL.value "$PREVIEW_DATABASE_URL" \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.DATABASE_URL_UNPOOLED.value "$PREVIEW_DATABASE_URL_UNPOOLED" \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.PREVIEW_DATABASE_URL.value "$PREVIEW_DATABASE_URL" \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.DELIVERY_ENABLED.value false \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.TELEGRAM_PRODUCTION_BOT_TOKEN.value disabled-in-preview \
              --service-config "$RAILWAY_WORKER_SERVICE_ID" variables.TELEGRAM_PRODUCTION_CHAT_ID.value disabled-in-preview
          fi

          node scripts/set-railway-variables.mjs preview

      - name: Check provider account quota
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/check-provider-quota.py

      - name: Keep deployment evidence outside the upload context
        run: echo "DEPLOYMENT_ARTIFACT_DIR=$RUNNER_TEMP/deployment-artifacts" >> "$GITHUB_ENV"

      - name: Deploy Railway preview services
        timeout-minutes: 15
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
        run: |
          bash scripts/deploy-railway-service.sh "$RAILWAY_API_SERVICE_ID" api
          bash scripts/deploy-railway-service.sh "$RAILWAY_WORKER_SERVICE_ID" worker

      - name: Wait for the exact migrated API commit
        id: railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRE_WORKER_READY: "true"
        run: bash scripts/wait-for-railway-api.sh

      - name: Give the preview API its public URL
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: printf '%s' "$API_URL" | railway variable set PUBLIC_APP_URL --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

      - name: Deploy one Vercel preview
        id: vercel
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
        run: |
          preview_url="$(vercel deploy --yes --target preview --cwd frontend \
            --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" \
            --build-env RAILWAY_API_BASE_URL="$API_URL" \
            --env RAILWAY_API_BASE_URL="$API_URL" \
            --env NEON_AUTH_BASE_URL="$NEON_AUTH_BASE_URL" \
            --env NEON_AUTH_COOKIE_SECRET="$NEON_AUTH_COOKIE_SECRET" \
            --build-env NEON_AUTH_BASE_URL="$NEON_AUTH_BASE_URL" \
            --meta githubCommitSha="$HEAD_SHA" \
            --meta previewRepository="$GITHUB_REPOSITORY" \
            --meta previewPullRequest="$PREVIEW_PULL_REQUEST" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          deployment_id="$(vercel inspect "$preview_url" --json --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" | jq -r '.id')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Trust the exact preview origin
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          printf '%s' "$PREVIEW_URL" | railway variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"
          if ! neon neon-auth domain list --project-id "${{ vars.NEON_PROJECT_ID }}" --branch "$NEON_BRANCH" --output json --no-color | jq -e --arg url "$PREVIEW_URL" '.. | scalars | select(. == $url)' >/dev/null; then
            neon neon-auth domain add "$PREVIEW_URL" --project-id "${{ vars.NEON_PROJECT_ID }}" --branch "$NEON_BRANCH" --no-color
          fi
          domains_json="$(neon neon-auth domain list --project-id "${{ vars.NEON_PROJECT_ID }}" --branch "$NEON_BRANCH" --output json --no-color)"
          NEON_AUTH_DOMAINS_JSON="$domains_json" EXPECTED_FRONTEND_ORIGIN="$PREVIEW_URL" \
            node scripts/validate-preview-auth-config.mjs >/dev/null
          railway redeploy --yes --service "$RAILWAY_API_SERVICE_ID" --environment "$PREVIEW_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"

      - name: Verify final preview API readiness
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ env.PREVIEW_ENVIRONMENT }}
          EXPECTED_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_FRONTEND_ORIGIN: ${{ steps.vercel.outputs.preview_url }}
          REQUIRE_WORKER_READY: "true"
        run: bash scripts/wait-for-railway-api.sh

      - name: Seed isolated Match Lab preview fixture
        env:
          PREVIEW_DATABASE_URL_UNPOOLED: ${{ steps.neon.outputs.db_url }}
        run: psql "$PREVIEW_DATABASE_URL_UNPOOLED" -v ON_ERROR_STOP=1 -f database/preview/seed_match_lab_smoke.sql

      - name: Smoke-test browser match data path
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          FRONTEND_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl /match --deployment "$FRONTEND_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- --fail --silent --show-error >/dev/null
          cookie_file="$(mktemp)"
          body_file="$(mktemp)"
          vercel curl /api/match/annotations/next --deployment "$FRONTEND_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- \
            --fail --silent --show-error \
            -c "$cookie_file" -b "$cookie_file" -o "$body_file"
          grep -Fq 'finite_feed_match_reviewer' "$cookie_file"
          jq -e '.profile_id and .video_id and (.topics | type == "array") and .title and .description' "$body_file" >/dev/null
          profile_id="$(jq -r '.profile_id' "$body_file")"
          video_id="$(jq -r '.video_id' "$body_file")"
          vercel curl /api/match/annotations --deployment "$FRONTEND_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- \
            --fail --silent --show-error \
            -c "$cookie_file" -b "$cookie_file" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg profile "$profile_id" --arg video "$video_id" '{profile_id:$profile,video_id:$video,label:"yes",rationale:null}')" \
            >/dev/null
          vercel curl /api/match/annotations/stats --deployment "$FRONTEND_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- \
            --fail --silent --show-error -c "$cookie_file" -b "$cookie_file" | jq -e '.completed >= 1' >/dev/null

      - name: Verify Google OAuth accepts the preview callback
        env:
          FRONTEND_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          oauth_start_file="$(mktemp)"
          trap 'rm -f "$oauth_start_file"' EXIT
          vercel curl /api/auth/sign-in/social --deployment "$FRONTEND_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" -- \
            --fail --silent --show-error \
            --request POST \
            -H 'Content-Type: application/json' \
            -H "Origin: $FRONTEND_URL" \
            --data "$(jq -nc --arg callback "$FRONTEND_URL/auth/callback" '{provider:"google",callbackURL:$callback,disableRedirect:true}')" \
            -o "$oauth_start_file"
          node scripts/verify-google-oauth-start.mjs \
            --payload-file "$oauth_start_file" \
            --expected-callback "$NEON_AUTH_BASE_URL/callback/google"

      - name: Verify isolated native account sessions
        timeout-minutes: 5
        env:
          FRONTEND_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: python3 scripts/smoke-preview-native-auth.py --preview-url "$FRONTEND_URL" --auth-only

      - name: Post or update preview summary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.vercel.outputs.deployment_id }}
          BRANCH_EXPIRES_AT: ${{ steps.expiry.outputs.expires_at }}
        with:
          script: |
            const marker = '<!-- full-stack-preview -->';
            const body = `${marker}\nFull-stack preview is ready.\n\nFrontend: ${process.env.PREVIEW_URL}\n\nAPI readiness: ${process.env.API_URL}/ready\n\nDatabase: Neon branch \`${process.env.NEON_BRANCH}\`\n\nGoogle OAuth callback: \`${process.env.GOOGLE_OAUTH_CALLBACK}\`\n\nRegister this callback once for this Neon branch. A new Vercel deployment URL does not change it.\n\nAccounts created in this preview, including email/password accounts, are isolated to this branch and are removed when the branch closes or expires at \`${process.env.BRANCH_EXPIRES_AT}\`.\n\nVercel deployment: \`${process.env.VERCEL_DEPLOYMENT_ID}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == vars.TRUSTED_PREVIEW_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Require the PR to remain closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-preview-state.mjs cleanup
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.47.2

      - name: Recover legacy recorded Vercel deployment IDs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const ids = comments
              .filter(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes('<!-- full-stack-preview -->'))
              .flatMap(comment => [...comment.body.matchAll(/Vercel deployment: `(dpl_[A-Za-z0-9]+)`/g)].map(match => match[1]));
            core.exportVariable('VERCEL_LEGACY_DEPLOYMENT_IDS', [...new Set(ids)].join(','));

      - name: Delete all exact preview resources
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/cleanup-previews.mjs
