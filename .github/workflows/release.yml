name: Release policy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from VERSION (without v)
        required: true
        type: string
      candidate_sha:
        description: Exact tested staging commit (full SHA)
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Attest the exact tested staging candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/validate-release-candidate.mjs
      - name: Record authenticated PR preparation command
        env:
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo '### Candidate attested'
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Candidate: \`$RELEASE_CANDIDATE_SHA\`"
            echo "- Preparation run: \`$GITHUB_RUN_ID\`"
            echo 'After this run succeeds, use the scripts/prepare-release.mjs helper with these values and the authenticated repository token so the PR starts its normal checks.'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require the prepared staging head and version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-release-pr.mjs
