name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: arctic-embed-xs-d8c86521100d3556476a063fc2342036d45c106f
      - run: python -m backend.app.migrate
      - run: python -m pytest backend/tests
      - run: python -m backend.evals.run_recommendation_eval

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          RAILWAY_API_BASE_URL: http://localhost:8000
      - run: npm run test:proxy
        working-directory: frontend
      - run: node --test scripts/validate-vercel-auth-location.test.mjs scripts/set-railway-variables.test.mjs scripts/verify-google-oauth-start.test.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  deploy-production:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: production
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_OIDC_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      VERCEL_OIDC_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 neon@4.13.1 vercel@50.1.3
      - name: Verify route-scoped admin protection contract
        # Full SDK tests run in the frontend job; this deploy gate has no node_modules.
        run: node --test frontend/tests/admin-route-proxy.test.mjs frontend/tests/admin-navigation.test.mjs
      - name: Require admin OIDC and Vercel Standard Protection
        run: |
          : "${VERCEL_OIDC_TEAM_SLUG:?VERCEL_TEAM_SLUG repository variable is required}"
          : "${VERCEL_OIDC_PROJECT_NAME:?VERCEL_PROJECT_NAME repository variable is required}"
          protection="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.ssoProtection.deploymentType // empty')"
          [[ "$protection" == "all_except_custom_domains" ]] || {
            echo 'Vercel Standard Protection (all_except_custom_domains) is required.' >&2
            exit 1
          }
      - name: Stamp and deploy Railway services
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_PRODUCTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PRODUCTION_BOT_TOKEN }}
          TELEGRAM_DEVELOPER_BOT_TOKEN: ${{ secrets.TELEGRAM_DEVELOPER_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MATCH_LAB_COOKIE_SECRET: ${{ secrets.MATCH_LAB_COOKIE_SECRET }}
          TELEGRAM_PRODUCTION_CHAT_ID: ${{ vars.TELEGRAM_PRODUCTION_CHAT_ID }}
          DEVELOPER_TELEGRAM_USER_IDS: ${{ vars.DEVELOPER_TELEGRAM_USER_IDS }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_MODEL_REVISION: ${{ vars.EMBEDDING_MODEL_REVISION }}
          EMBEDDING_BATCH_SIZE: ${{ vars.EMBEDDING_BATCH_SIZE }}
          DELIVERY_ENABLED: ${{ vars.DELIVERY_ENABLED }}
          MODEL_DAILY_REQUEST_LIMIT: ${{ vars.MODEL_DAILY_REQUEST_LIMIT }}
          YOUTUBE_DAILY_REQUEST_LIMIT: ${{ vars.YOUTUBE_DAILY_REQUEST_LIMIT }}
        run: |
          auth_url="$(neon neon-auth status --project-id "$NEON_PROJECT_ID" --branch "$NEON_PARENT_BRANCH" --output json --no-color | jq -er '.base_url | select(startswith("https://"))')"
          export NEON_AUTH_BASE_URL="$auth_url"
          echo "NEON_AUTH_BASE_URL=$auth_url" >> "$GITHUB_ENV"
          : "${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}"
          : "${TELEGRAM_PRODUCTION_BOT_TOKEN:?TELEGRAM_PRODUCTION_BOT_TOKEN is required}"
          : "${MATCH_LAB_COOKIE_SECRET:?MATCH_LAB_COOKIE_SECRET is required}"
          node scripts/set-railway-variables.mjs production
          railway redeploy --from-source --yes --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          railway redeploy --from-source --yes --service "$RAILWAY_WORKER_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Wait for the exact migrated API commit
        id: railway
        run: bash scripts/wait-for-railway-api.sh
      - name: Deploy frontend once and resolve its production origin
        id: vercel
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
        run: |
          deployment_url="$(vercel deploy --prod --yes --cwd frontend \
            --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" \
            --build-env RAILWAY_API_BASE_URL="$API_URL" \
            --env RAILWAY_API_BASE_URL="$API_URL" \
            --env NEON_AUTH_BASE_URL="$NEON_AUTH_BASE_URL" \
            --env NEON_AUTH_COOKIE_SECRET="$NEON_AUTH_COOKIE_SECRET" \
            --build-env NEON_AUTH_BASE_URL="$NEON_AUTH_BASE_URL" \
            --build-env NEON_AUTH_COOKIE_SECRET="$NEON_AUTH_COOKIE_SECRET" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          production_url=""
          for _ in $(seq 1 12); do
            production_url="$(vercel project list --json --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" | jq -r --arg id "$VERCEL_PROJECT_ID" '.projects[] | select(.id == $id) | .latestProductionUrl // empty')"
            [[ -n "$production_url" ]] && break
            sleep 5
          done
          [[ -n "$production_url" ]] || { echo 'Vercel production URL was not available.' >&2; exit 1; }
          [[ "$production_url" == https://* ]] || { echo 'Vercel production URL must use HTTPS.' >&2; exit 1; }
          production_host="${production_url#https://}"
          production_host="${production_host%%/*}"
          custom_domain="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | jq -r --arg host "$production_host" '[.domains[] | select(.name == $host)] | length')"
          [[ "$custom_domain" == "1" ]] || { echo 'Production URL is not a configured Vercel project domain.' >&2; exit 1; }

          for admin_path in /admin /api/admin/summary; do
            headers_file="$(mktemp)"
            admin_status="$(curl --silent --show-error --dump-header "$headers_file" \
              --output /dev/null --write-out '%{http_code}' "$deployment_url$admin_path")"
            case "$admin_status" in
              401|403) ;;
              301|302|303|307|308)
                auth_location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, "", $2); print $2; exit }' "$headers_file")"
                node scripts/validate-vercel-auth-location.mjs "$auth_location" || {
                  echo "Generated deployment $admin_path redirected somewhere other than Vercel authentication." >&2
                  exit 1
                }
                ;;
              *) echo "Generated deployment $admin_path did not require authentication (HTTP $admin_status)." >&2; exit 1 ;;
            esac
          done
          match_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$production_url/match")"
          [[ "$match_status" == "200" ]] || { echo "Public custom-domain /match returned HTTP $match_status instead of 200." >&2; exit 1; }
          origins="$(jq -nr --arg deployment "$deployment_url" --arg production "$production_url" '[$deployment, $production] | unique | join(",")')"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "production_url=$production_url" >> "$GITHUB_OUTPUT"
          echo "origins=$origins" >> "$GITHUB_OUTPUT"
      - name: Give the API and worker their public URL
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
        run: |
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            printf '%s' "$API_URL" | railway variable set PUBLIC_APP_URL --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
          done
          railway redeploy --yes --service "$RAILWAY_WORKER_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Trust the exact frontend origins
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
          FRONTEND_ORIGINS: ${{ steps.vercel.outputs.origins }}
          PRODUCTION_URL: ${{ steps.vercel.outputs.production_url }}
        run: |
          printf '%s' "$FRONTEND_ORIGINS" | railway variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          for origin in "$DEPLOYMENT_URL" "$PRODUCTION_URL"; do
            if ! neon neon-auth domain list --project-id "$NEON_PROJECT_ID" --branch "$NEON_PARENT_BRANCH" --output json --no-color | jq -e --arg url "$origin" '.. | scalars | select(. == $url)' >/dev/null; then
              neon neon-auth domain add "$origin" --project-id "$NEON_PROJECT_ID" --branch "$NEON_PARENT_BRANCH" --no-color
            fi
          done
          railway redeploy --yes --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Verify final production API readiness
        env:
          EXPECTED_FRONTEND_ORIGIN: ${{ steps.vercel.outputs.production_url }}
        run: bash scripts/wait-for-railway-api.sh
