name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/app
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: arctic-embed-xs-d8c86521100d3556476a063fc2342036d45c106f
      - run: python -m backend.app.migrate
      - run: python -m pytest backend/tests
      - run: python -m backend.evals.run_recommendation_eval

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          RAILWAY_API_BASE_URL: http://localhost:8000
      - run: npm run test:proxy
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  deploy-production:
    if: vars.BOOTSTRAP_COMPLETE == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: production
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_OIDC_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
      VERCEL_OIDC_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deployment CLIs
        run: npm install --global @railway/cli@5.47.2 neon@4.13.1 vercel@50.1.3
      - name: Verify route-scoped admin protection contract
        run: npm --prefix frontend run test:proxy
      - name: Require admin OIDC and Vercel Standard Protection
        run: |
          : "${VERCEL_OIDC_TEAM_SLUG:?VERCEL_TEAM_SLUG repository variable is required}"
          : "${VERCEL_OIDC_PROJECT_NAME:?VERCEL_PROJECT_NAME repository variable is required}"
          protection="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.ssoProtection.deploymentType // empty')"
          [[ "$protection" == "all_except_custom_domains" ]] || {
            echo 'Vercel Standard Protection (all_except_custom_domains) is required.' >&2
            exit 1
          }
      - name: Stamp and deploy Railway services
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_PRODUCTION_BOT_TOKEN: ${{ secrets.TELEGRAM_PRODUCTION_BOT_TOKEN }}
          TELEGRAM_DEVELOPER_BOT_TOKEN: ${{ secrets.TELEGRAM_DEVELOPER_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_PRODUCTION_CHAT_ID: ${{ vars.TELEGRAM_PRODUCTION_CHAT_ID }}
          DEVELOPER_TELEGRAM_USER_IDS: ${{ vars.DEVELOPER_TELEGRAM_USER_IDS }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_MODEL_REVISION: ${{ vars.EMBEDDING_MODEL_REVISION }}
          EMBEDDING_BATCH_SIZE: ${{ vars.EMBEDDING_BATCH_SIZE }}
        run: |
          : "${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}"
          : "${TELEGRAM_PRODUCTION_BOT_TOKEN:?TELEGRAM_PRODUCTION_BOT_TOKEN is required}"
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            printf '%s' "$EXPECTED_COMMIT_SHA" | railway variable set APP_COMMIT_SHA --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' "$YOUTUBE_API_KEY" | railway variable set YOUTUBE_API_KEY --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' "$TELEGRAM_PRODUCTION_BOT_TOKEN" | railway variable set TELEGRAM_PRODUCTION_BOT_TOKEN --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            for variable in OPENROUTER_API_KEY TELEGRAM_DEVELOPER_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET TELEGRAM_PRODUCTION_CHAT_ID DEVELOPER_TELEGRAM_USER_IDS; do
              value="${!variable:-}"
              if [[ -n "$value" ]]; then
                printf '%s' "$value" | railway variable set "$variable" --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
              elif railway variable list --json --service "$service" --environment production --project "$RAILWAY_PROJECT_ID" | jq -e --arg variable "$variable" 'has($variable)' >/dev/null; then
                railway variable delete "$variable" --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
              fi
            done
            printf '%s' "${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}" | railway variable set OPENROUTER_MODEL --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' "${EMBEDDING_MODEL:-Snowflake/snowflake-arctic-embed-xs}" | railway variable set EMBEDDING_MODEL --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' "${EMBEDDING_MODEL_REVISION:-d8c86521100d3556476a063fc2342036d45c106f}" | railway variable set EMBEDDING_MODEL_REVISION --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' "${EMBEDDING_BATCH_SIZE:-32}" | railway variable set EMBEDDING_BATCH_SIZE --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' '384' | railway variable set EMBEDDING_DIMENSIONS --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' 'true' | railway variable set EMBEDDING_OFFLINE --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
            printf '%s' '/opt/huggingface' | railway variable set EMBEDDING_CACHE_DIR --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
          done
          printf '%s' "$VERCEL_OIDC_TEAM_SLUG" | railway variable set VERCEL_OIDC_TEAM_SLUG --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          printf '%s' "$VERCEL_OIDC_PROJECT_NAME" | railway variable set VERCEL_OIDC_PROJECT_NAME --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          printf '%s' 'production' | railway variable set VERCEL_OIDC_ENVIRONMENT --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          railway redeploy --from-source --yes --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          railway redeploy --from-source --yes --service "$RAILWAY_WORKER_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Wait for the exact migrated API commit
        id: railway
        run: bash scripts/wait-for-railway-api.sh
      - name: Deploy frontend once and resolve its production origin
        id: vercel
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
        run: |
          deployment_url="$(vercel deploy --prod --yes --cwd frontend \
            --build-env NEXT_PUBLIC_API_BASE_URL="$API_URL" \
            --build-env RAILWAY_API_BASE_URL="$API_URL" \
            --env RAILWAY_API_BASE_URL="$API_URL" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")"
          production_url=""
          for _ in $(seq 1 12); do
            production_url="$(vercel project list --json --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" | jq -r --arg id "$VERCEL_PROJECT_ID" '.projects[] | select(.id == $id) | .latestProductionUrl // empty')"
            [[ -n "$production_url" ]] && break
            sleep 5
          done
          [[ -n "$production_url" ]] || { echo 'Vercel production URL was not available.' >&2; exit 1; }
          admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$deployment_url/admin")"
          case "$admin_status" in
            301|302|303|307|308|401|403) ;;
            *) echo "Generated deployment /admin did not require authentication (HTTP $admin_status)." >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error "$production_url/match" >/dev/null
          origins="$(jq -nr --arg deployment "$deployment_url" --arg production "$production_url" '[$deployment, $production] | unique | join(",")')"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "production_url=$production_url" >> "$GITHUB_OUTPUT"
          echo "origins=$origins" >> "$GITHUB_OUTPUT"
      - name: Give the API and worker their public URL
        env:
          API_URL: ${{ steps.railway.outputs.api_url }}
        run: |
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WORKER_SERVICE_ID"; do
            printf '%s' "$API_URL" | railway variable set PUBLIC_APP_URL --stdin --skip-deploys --service "$service" --environment production --project "$RAILWAY_PROJECT_ID"
          done
          railway redeploy --yes --service "$RAILWAY_WORKER_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Trust the exact frontend origins
        env:
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
          FRONTEND_ORIGINS: ${{ steps.vercel.outputs.origins }}
          PRODUCTION_URL: ${{ steps.vercel.outputs.production_url }}
        run: |
          printf '%s' "$FRONTEND_ORIGINS" | railway variable set FRONTEND_ORIGINS --stdin --skip-deploys --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
          for origin in "$DEPLOYMENT_URL" "$PRODUCTION_URL"; do
            if ! neon neon-auth domain list --project-id "$NEON_PROJECT_ID" --branch "$NEON_PARENT_BRANCH" --output json --no-color | jq -e --arg url "$origin" '.. | scalars | select(. == $url)' >/dev/null; then
              neon neon-auth domain add "$origin" --project-id "$NEON_PROJECT_ID" --branch "$NEON_PARENT_BRANCH" --no-color
            fi
          done
          railway redeploy --yes --service "$RAILWAY_API_SERVICE_ID" --environment production --project "$RAILWAY_PROJECT_ID"
      - name: Verify final production API readiness
        env:
          EXPECTED_FRONTEND_ORIGIN: ${{ steps.vercel.outputs.production_url }}
        run: bash scripts/wait-for-railway-api.sh
